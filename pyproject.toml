[project]
name = "homemade-bci-decoder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "seanbug", email = "sean.william.berg1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
homemade-bci-decoder = "homemade_bci_decoder:main"

[project.optional-dependencies]
paradigm = [
    "psychopy>=2026.2.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
